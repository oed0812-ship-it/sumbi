<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <!--
    샘플/가이드 SVG — assets/img/home_diver.svg
    화덕 앞에 앉은 동료 해녀 한 명. js/render.js drawBulteok() 이 이
    그림을 두 자리(왼쪽/오른쪽)에 그대로 재사용해서 그립니다.

    이 박스의 "바닥 중앙" (x=40, y=100)이 실제 앉는 자리 기준점입니다 —
    캐릭터가 바닥에 앉은 지점이 이 좌표에 오도록 그려주세요.
    두 자리 중 하나(오른쪽)는 살림 발견 순간 아주 살짝(수 px) 그
    방향으로 밀려서 "쳐다보는" 연출에 쓰이므로, 정면보다는 살짝
    옆모습/뒷모습 실루엣이 자연스럽습니다(지금 코드 폴백도 그렇습니다).

    파일명/크기(80x100)만 유지하면 코드 수정 없이 바로 적용됩니다.
  -->
  <ellipse cx="40" cy="74" rx="20" ry="26" fill="#0a0e10" fill-opacity="0.92"/>
  <circle  cx="40" cy="43" r="10.5" fill="#0a0e10" fill-opacity="0.92"/>
</svg>
