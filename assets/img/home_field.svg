<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 40" width="124" height="40">
  <!--
    샘플/가이드 SVG — assets/img/home_field.svg
    js/render.js drawBulteok() 이 이 이미지를 캔버스 절대좌표
    (204, 298) 크기 124x40 으로 얹습니다 — 단, "밭을 산 뒤(이랑 있는
    상태)"일 때만 이 그림을 씁니다. 사기 전 묵정밭(잡풀만 있는 상태)은
    내용이 단순해서 계속 코드로 그립니다.

    아래 사다리꼴은 밭 핫스팟(#hs-field)과 같은 자리이며, 원근을 살려
    위(먼 쪽)가 좁고 아래(가까운 쪽)가 넓습니다.
    파일명/크기(124x40)만 유지하면 코드 수정 없이 바로 적용됩니다.
  -->
  <!-- 흙바닥 (사다리꼴) -->
  <path d="M 0,40 L 124,40 L 102,0 L 22,0 Z" fill="#5c4a34" stroke="#dce8ec" stroke-opacity="0.32" stroke-width="1.4"/>
  <!-- 이랑 (원근에 맞춰 아래로 갈수록 넓어짐) -->
  <g stroke="#aac482" stroke-width="2.2">
    <line x1="17.6" y1="8"  x2="106.4" y2="8"/>
    <line x1="13.2" y1="16" x2="110.8" y2="16"/>
    <line x1="8.8"  y1="24" x2="115.2" y2="24"/>
    <line x1="4.4"  y1="32" x2="119.6" y2="32"/>
  </g>
</svg>
